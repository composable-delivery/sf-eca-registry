apiVersion: eca/v1
kind: ExternalClientAppPlan
metadata:
  name: CliJwtLogin
  label: CLI JWT Login
  description: Used by the Salesforce CLI command sf org login jwt.
  contactEmail: admin@example.com
  distributionState: Local
  isProtected: false
oauth:
  flowType: jwt-bearer
  callbackUrls:
    - http://localhost:1717/OauthRedirect
  scopes:
    - Api
    - Web
    - RefreshToken
  certificate:
    autoGenerate: true
  isConsumerSecretOptional: true
policies:
  permittedUsersPolicyType: AdminApprovedPreAuthorized
  ipRelaxationPolicyType: Enforce
  requiredSessionLevel: STANDARD
  refreshTokenPolicyType: SpecificLifetime
  refreshTokenValidityPeriod: 30
  refreshTokenValidityUnit: Days
