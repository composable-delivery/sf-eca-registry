name: registry

on:
  pull_request_target: { types: [opened, synchronize, reopened, labeled] }
  push: { branches: [main], tags: ['v*'] }

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
      pull-requests: write
    uses: composable-delivery/sf-eca-registry-kit/.github/workflows/validate.yml@07ef599ec64c13460f5f8cc856010fbf14395ecd
    secrets: inherit
  scratch-deploy:
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'approve-deploy'
    uses: composable-delivery/sf-eca-registry-kit/.github/workflows/scratch-deploy.yml@07ef599ec64c13460f5f8cc856010fbf14395ecd
    secrets: inherit
  release:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    if: startsWith(github.ref, 'refs/tags/v')
    uses: composable-delivery/sf-eca-registry-kit/.github/workflows/release.yml@07ef599ec64c13460f5f8cc856010fbf14395ecd
    secrets: inherit
  site:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name == 'push' && github.ref_type == 'branch'
    uses: composable-delivery/sf-eca-registry-kit/.github/workflows/site.yml@07ef599ec64c13460f5f8cc856010fbf14395ecd
